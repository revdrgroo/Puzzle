<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Canvas Project</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        canvas {
            border: 2px solid #fff;
            background-color: #6e7f86;
            display: block;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .button-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>

<body>
    <div class="app-container">
    <div class="button-row">
        <button class="btn" id="resetButton">Reset</button>
        <button class="btn" id="undoButton">Undo</button>
        <button class="btn" id="replayButton">Replay</button>
    </div>
    <canvas id="myCanvas" width="600" height="600"></canvas>
    <script src="dist/SlidingPuzzle.js"></script>
</body>

</html>
